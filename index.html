<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Demo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>2D Demo Game</h1>
    <p class="description">Използвайте стрелките, за да движите зеления блок. Събирайте жълтите точки и избягвайте червените врагове.</p>
    <canvas id="game" width="640" height="480"></canvas>
    <div class="status">
      Точки: <span id="score">0</span>
      &nbsp;|&nbsp;
      Живот: <span id="lives">3</span>
    </div>
    <p class="hint">Натиснете Enter, за да рестартирате след Game Over.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
